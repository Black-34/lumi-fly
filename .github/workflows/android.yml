name: Android
permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.LF_KEYSTORE_B64 != '' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund
      - name: Prepare web files (runtime + fonts)
        run: npm run prepare:web
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Lumi Fly settings + Play checks
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: python3 tools/patch_android.py

      - name: Test APK (install directly on your phone)
        run: cd android && ./gradlew --no-daemon assembleDebug

      - name: Store bundle (.aab, only when the upload key is set up)
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          LF_KS_PASS: ${{ secrets.LF_KS_PASS }}
          LF_KEY_ALIAS: ${{ secrets.LF_KEY_ALIAS }}
          LF_KEY_PASS: ${{ secrets.LF_KEY_PASS }}
        run: |
          echo "${{ secrets.LF_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/upload.jks
          export LF_KEYSTORE=$RUNNER_TEMP/upload.jks
          cd android && ./gradlew --no-daemon bundleRelease

      - name: Rename
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/LumiFly-test-${{ github.run_number }}.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab "out/LumiFly-${{ github.run_number }}.aab"; fi
      - uses: actions/upload-artifact@v6
        with:
          name: LumiFly-${{ github.run_number }}
          path: out/*
      - name: Publish test APK as download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Lumi Fly Test ${{ github.run_number }}
          prerelease: true
          files: out/*.apk
          body: "Test-APK zum direkten Installieren auf dem Handy."
